name: Infra Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Nunca dos applies a la vez sobre el mismo state
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  terraform-deploy:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Opcional: descomenta para exigir aprobación manual antes del apply.
    # Requiere crear el environment "production" con reviewers en
    # Settings > Environments del repo (tu trust policy con ":*" ya lo cubre).
    # environment: production

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Validate
        run: |
          terraform init -input=false
          terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan