name: AMI Build & SSM Update

on:
  push:
    branches:
      - main
      - JuanFeatures
    paths:
      - 'packer/**'
      - 'ansible/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test-ami:
    name: Build, Test with Goss & Update SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Autenticación AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configurar Packer
        uses: hashicorp/setup-packer@v2
        with:
          version: 'latest'

      - name: Instalar Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Packer Init & Validate
        run: |
          cd packer
          packer init aws-ubuntu.pkr.hcl
          packer validate aws-ubuntu.pkr.hcl

      - name: Build AMI con Packer y Validar con Goss
        id: packer
        run: |
          cd packer
          # Captura el ID de la AMI desde la salida del build
          AMI_ID=$(packer build -machine-readable aws-ubuntu.pkr.hcl | awk -F, '$0 ~/artifact,0,id/ {print $6}' | cut -d':' -f2)
          echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV
          echo "Nueva Golden AMI creada: $AMI_ID"

      - name: Actualizar SSM Parameter Store
        run: |
          aws ssm put-parameter \
            --name "/gitops/ami/latest_id" \
            --value "${{ env.AMI_ID }}" \
            --type "String" \
            --overwrite